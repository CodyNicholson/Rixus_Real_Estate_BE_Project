services:
  app:
    build: .
    container_name: rixus-be-app
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-rixus}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN:-}
      - CF_POLICY_AUD=${CF_POLICY_AUD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - tunnel-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: rixus-be-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-rixus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-rixus}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  tunnel-net:
    external: true

volumes:
  postgres_data:
